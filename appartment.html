  --surface:#ffffff; --field:#f3f6f4; --ink:#17251f; --muted:#5a6b62; --line:#cdd8d1;
  --accent:#1f6f54; --accent-ink:#ffffff; --soft:#e2efe8; --shadow:0 18px 50px rgba(8,20,14,.35);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --surface:#18231e; --field:#111a16; --ink:#e8f0eb; --muted:#9db1a6; --line:#33463c;
    --accent:#5cc79d; --accent-ink:#0b1812; --soft:#21382d; --shadow:0 18px 50px rgba(0,0,0,.55); color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --surface:#18231e; --field:#111a16; --ink:#e8f0eb; --muted:#9db1a6; --line:#33463c;
  --accent:#5cc79d; --accent-ink:#0b1812; --soft:#21382d; --shadow:0 18px 50px rgba(0,0,0,.55); color-scheme: dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Hind","Noto Sans Devanagari",system-ui,sans-serif;font-size:17px;line-height:1.5;background:#14231c;position:relative}
/* Background photo + scrim */
body::before{content:"";position:fixed;inset:0;z-index:-2;background:var(--photo) center/cover no-repeat}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,24,17,.55) 0%,rgba(10,24,17,.35) 40%,rgba(10,24,17,.78) 100%)}

.wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:18px 16px 22px;max-width:520px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{color:#fff;font-family:"Baloo 2","Hind",sans-serif;font-weight:700;font-size:1.25rem;line-height:1.2;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.brand small{display:block;font-family:"Hind",sans-serif;font-weight:500;font-size:.8rem;opacity:.85}
.lang{display:flex;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:3px;flex-shrink:0}
.lang button{border:0;background:transparent;color:#fff;font:inherit;font-weight:600;padding:5px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:#14392b}

.card{background:var(--surface);border-radius:18px;padding:24px 22px 22px;box-shadow:var(--shadow);margin-top:40px}
h1{font-family:"Baloo 2","Hind",sans-serif;font-size:1.65rem;line-height:1.2;margin:0}
.sub{color:var(--muted);margin:4px 0 20px;font-size:.95rem}
label{display:block;font-weight:600;margin:0 0 6px;font-size:.95rem}
select{width:100%;font:inherit;color:var(--ink);background-color:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:12px 42px 12px 14px;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 21px) 55%,calc(100% - 15px) 55%;background-size:6px 6px;background-repeat:no-repeat}
select:disabled{opacity:.5;cursor:not-allowed}
select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.field+.field{margin-top:16px}
.hint{font-size:.85rem;color:var(--muted);margin-top:6px}
.result{margin-top:22px;border-radius:12px;background:var(--soft);padding:14px 18px;min-height:82px;display:flex;align-items:center}
.result .lbl{font-size:.88rem;color:var(--muted)}
.result .num{font-family:"Baloo 2",sans-serif;font-size:2.2rem;font-weight:700;line-height:1.1;color:var(--accent)}
.result .empty{font-family:"Hind",sans-serif;font-size:1.05rem;font-weight:400;color:var(--muted)}
.confirm{width:100%;margin-top:14px;font:inherit;font-weight:600;border:0;border-radius:10px;padding:14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.confirm:disabled{opacity:.4;cursor:not-allowed}
.done{margin-top:14px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--accent);font-weight:500}
[hidden]{display:none!important}

/* Wide screens: blur the low-res photo behind, show it sharp in a side panel */
.photo{display:none}
@media (min-width:900px){
  body::before{filter:blur(12px);transform:scale(1.06)}
  .wrap{max-width:1000px;flex-direction:row;flex-wrap:wrap;align-content:center;justify-content:center;gap:0 32px;padding:28px}
  .top{width:100%;margin-bottom:24px}
  .photo{display:block;flex:0 0 340px;border-radius:18px;background:var(--photo) center/cover no-repeat;box-shadow:var(--shadow);min-height:520px;border:3px solid rgba(255,255,255,.85)}
  .card{flex:0 0 420px;margin-top:0;align-self:center}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span id="brand"></span><small id="brandSub"></small></div>
    <div class="lang" role="group" aria-label="Language / भाषा">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="hi" aria-pressed="false">हिं</button>
    </div>
  </div>

  <div class="photo" role="img" aria-label="Shakuntalam apartment building"></div>

  <section class="card">
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <div class="field">
      <label for="floor" id="floorLbl"></label>
      <select id="floor"></select>
    </div>
    <div class="field">
      <label for="flat" id="flatLbl"></label>
      <select id="flat" disabled></select>
      <div class="hint" id="hint"></div>
    </div>
    <div class="result" aria-live="polite">
      <div>
        <div class="lbl" id="resLbl"></div>
        <div class="num" id="resNum"></div>
      </div>
    </div>
    <button class="confirm" id="confirm" type="button" disabled></button>
    <div class="done" id="done" hidden></div>
  </section>
</div>

<script>
const T = {
  en:{brand:"Shakuntalam",brandSub:"Apartment society",title:"Select your flat",sub:"Choose your floor, then your flat.",floor:"Floor",flat:"Flat",
      pickFloor:"Select floor",pickFlat:"Select flat",hintOff:"Choose a floor first.",hintOn:"Flats A to N are on this floor.",
      resLbl:"Your flat",none:"Not selected yet",confirm:"Confirm flat",
      ground:"Ground floor",ord:n=>{const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])+" floor"},
      done:n=>"Flat "+n+" confirmed."},
  hi:{brand:"शकुन्तलम",brandSub:"अपार्टमेंट सोसाइटी",title:"अपना फ़्लैट चुनें",sub:"पहले मंज़िल चुनें, फिर फ़्लैट।",floor:"मंज़िल",flat:"फ़्लैट",
      pickFloor:"मंज़िल चुनें",pickFlat:"फ़्लैट चुनें",hintOff:"पहले मंज़िल चुनें।",hintOn:"इस मंज़िल पर फ़्लैट A से N तक हैं।",
      resLbl:"आपका फ़्लैट",none:"अभी चुना नहीं गया",confirm:"फ़्लैट पक्का करें",
      ground:"भूतल (ग्राउंड फ़्लोर)",ord:n=>n+"वीं मंज़िल",
      done:n=>"फ़्लैट "+n+" पक्का हो गया।"}
};
const FLOORS = 15, LETTERS = "ABCDEFGHIJKLMN".split("");
let lang = "en";
try{ const s=localStorage.getItem("lang"); if(s==="hi"||s==="en") lang=s; }catch(e){}
const $ = id => document.getElementById(id);
const floorEl=$("floor"), flatEl=$("flat");
function floorLabel(f){ return f===0 ? T[lang].ground : T[lang].ord(f); }
function render(){
  const t=T[lang];
  document.documentElement.lang = lang; document.title = t.title;
  $("brand").textContent=t.brand; $("brandSub").textContent=t.brandSub;
  $("title").textContent=t.title; $("sub").textContent=t.sub;
  $("floorLbl").textContent=t.floor; $("flatLbl").textContent=t.flat;
  $("resLbl").textContent=t.resLbl; $("confirm").textContent=t.confirm;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  const fv=floorEl.value, lv=flatEl.value;
  floorEl.innerHTML = `<option value="">${t.pickFloor}</option>` +
    Array.from({length:FLOORS+1},(_,i)=>`<option value="${i}">${floorLabel(i)}</option>`).join("");
  floorEl.value=fv;
  flatEl.innerHTML = `<option value="">${t.pickFlat}</option>` + LETTERS.map(l=>`<option value="${l}">${l}</option>`).join("");
  flatEl.value=lv;
  update(false);
}
function code(){ return (floorEl.value===""||flatEl.value==="") ? "" : flatEl.value + floorEl.value; }
function update(clearDone=true){
  const t=T[lang], hasFloor=floorEl.value!=="";
  flatEl.disabled=!hasFloor;
  $("hint").textContent = hasFloor ? t.hintOn : t.hintOff;
  const c=code();
  $("resNum").innerHTML = c ? c : `<span class="empty">${t.none}</span>`;
  $("confirm").disabled=!c;
  if(clearDone) $("done").hidden=true;
}
floorEl.addEventListener("change",()=>{ flatEl.value=""; update(); });
flatEl.addEventListener("change",()=>update());
$("confirm").addEventListener("click",()=>{ const d=$("done"); d.textContent=T[lang].done(code()); d.hidden=false; });
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{
  lang=b.dataset.lang; try{localStorage.setItem("lang",lang);}catch(e){}
  const was=!$("done").hidden; render();
  if(was){ $("done").textContent=T[lang].done(code()); $("done").hidden=false; }
}));
render();
</script>
</body>
</html>
